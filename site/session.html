<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fill a document</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 8h10l5 5v11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M13 17l2 2 4-4' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- Shown while the ingest pipeline works. Without it the page is blank for
       the whole wait, because #app below stays hidden until the session is
       ready and the progress text lives inside it. -->
  <div class="bg-decor" id="loading-decor" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="grid-overlay"></span>
  </div>

  <section class="loading-shell" id="session-loading" role="status" aria-live="polite">
    <div class="brand-badge">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <path d="M14 2v6h6" />
        <path d="M9 15l2 2 4-4" />
      </svg>
    </div>
    <h1 id="loading-title">Reading your document</h1>
    <p class="status-line" id="session-error"></p>
    <p class="fine-print" id="loading-note">This usually takes a few seconds. You can leave this page open.</p>
    <a class="button-link hidden" id="loading-back" href="./index.html">Start over</a>
  </section>

  <div class="app hidden" id="app">
    <div class="topbar">
      <span class="brand-mark">FA</span>
      <span class="title" id="doc-title">Document</span>
      <span class="progress" id="progress"></span>
      <a href="./index.html">New document</a>
    </div>

    <div class="viewer-pane" id="viewer-pane"></div>

    <div class="side">
      <div class="side-header">
        <div class="side-tabs" role="tablist">
          <button type="button" class="side-tab active" role="tab" data-side-tab="fields">Form fields</button>
          <button type="button" class="side-tab hidden" role="tab" data-side-tab="guide">Guide</button>
        </div>
        <p>Fill directly, or select fields to discuss with the assistant.</p>
      </div>

      <!-- Everything standing between a filled form and a filed one: unconfirmed
           agent drafts (which strict rendering refuses to export) and values too
           wide for their box (which the export silently cuts off). A fixed rail,
           not part of the scrolling field list, because on a 97-field form the
           list is exactly where these get lost. -->
      <div class="drafts-bar hidden" id="drafts-bar"></div>

      <div class="fields-panel" id="fields-panel" data-side-panel="fields"></div>
      <div class="guide-panel hidden" id="guide-panel" data-side-panel="guide"></div>

      <div class="validate-bar" id="render-panel">
        <span class="summary"></span>
        <label>
          <input type="checkbox" data-role="flatten" /> flatten
        </label>
        <button type="button" data-action="validate">Check</button>
        <button type="button" class="primary" data-action="render" disabled>Render</button>
        <a class="hidden" data-role="download" download>Download</a>
        <div class="awaiting-list"></div>
      </div>

      <div class="chat-pane">
        <div class="chat-scope hidden" id="chat-scope"></div>
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-input">
          <span class="voice-status" id="voice-status" role="status" aria-live="polite"></span>
          <textarea id="chat-input" placeholder="Ask the assistant about this form..." dir="auto"></textarea>
          <!-- Both voice buttons ship hidden and are revealed by their own module
               only once it has confirmed the browser can actually do the job. -->
          <button type="button" class="hidden" id="chat-speak" title="Read replies aloud" aria-label="Read replies aloud" aria-pressed="false"></button>
          <button type="button" class="hidden" id="chat-mic" title="Dictate a message" aria-label="Dictate a message" data-state="idle"></button>
          <button type="button" class="primary" id="chat-send" title="Send" aria-label="Send"></button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/session.js"></script>
</body>
</html>
