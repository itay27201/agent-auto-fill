<!DOCTYPE html>
<!--
calibrate.html — stage A3. Open it, drop in the registry folder's files, confirm.

Deliberately a single static file with no build step and no server: it is meant
to be dropped on S3 next to the rest of the console. Everything happens in the
browser; the only output is schema.json, which you download and commit.

Load: page_N.png  +  schema.draft.json  (+ labels.bedrock.json if you ran A2)
-->
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>כיול טופס — Form Registry Calibration</title>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e26; --line: #2c313d; --ink: #e6e8ee;
    --dim: #8b93a6; --acc: #6ea8fe; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); display: flex; height: 100vh; }
  #side { width: 380px; flex: none; background: var(--panel); border-inline-start: 1px solid var(--line);
          display: flex; flex-direction: column; order: 2; }
  #stage { flex: 1; overflow: auto; position: relative; padding: 16px; }
  #wrap { position: relative; display: inline-block; }
  #wrap img { display: block; max-width: none; }
  svg { position: absolute; inset: 0; }
  rect.cand { fill: transparent; stroke-width: 1.4; cursor: pointer; }
  rect.cand.checkbox { stroke: #f87171; }
  rect.cand.comb { stroke: #6ea8fe; }
  rect.cand.underline { stroke: #4ade80; }
  rect.cand.confirmed { stroke-width: 2.4; fill: rgba(110,168,254,.14); }
  rect.cand.dropped { stroke: #444; stroke-dasharray: 3 3; opacity: .35; }
  rect.cand.sel { stroke: #fff; stroke-width: 3; }
  header, footer { padding: 12px 14px; border-block-end: 1px solid var(--line); }
  footer { border: 0; border-block-start: 1px solid var(--line); display: flex; gap: 8px; }
  #list { flex: 1; overflow: auto; }
  .row { padding: 7px 14px; border-block-end: 1px solid #23272f; cursor: pointer;
         display: flex; gap: 8px; align-items: center; }
  .row:hover { background: #232733; }
  .row.sel { background: #2a3346; }
  .row .id { font: 11px ui-monospace, monospace; color: var(--dim); flex: none; width: 96px; }
  .row .lb { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.todo { background: var(--warn); } .dot.ok { background: var(--ok); }
  .dot.drop { background: #4b5563; }
  label { display: block; font-size: 11px; color: var(--dim); margin-block: 8px 2px; }
  input, select, button { width: 100%; padding: 6px 8px; background: #0f1116; color: var(--ink);
                          border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  button { cursor: pointer; background: #263043; }
  button.pri { background: var(--acc); color: #08101f; font-weight: 600; }
  button.danger { background: #3b1f24; color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hint { font-size: 11px; color: var(--warn); margin-top: 6px; }
  #edit { padding: 0 14px 14px; overflow: auto; }
  kbd { background: #0f1116; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>

<div id="stage"><div id="wrap"><img id="pg"><svg id="ov"></svg></div></div>

<div id="side">
  <header>
    <div class="grid2">
      <input type="file" id="fJson" accept=".json" title="schema.draft.json">
      <input type="file" id="fImg" accept="image/*" multiple title="page_N.png">
    </div>
    <div class="grid2" style="margin-top:8px">
      <select id="page"></select>
      <select id="filter">
        <option value="all">הכל</option>
        <option value="todo">לא אושרו</option>
        <option value="flag">מסומנים כחשודים</option>
        <option value="checkbox">תיבות סימון</option>
        <option value="comb">שדות ספרות</option>
      </select>
    </div>
    <div style="margin-top:6px;font-size:11px;color:var(--dim)">
      <kbd>A</kbd> אישור · <kbd>D</kbd> מחיקה · <kbd>↑</kbd><kbd>↓</kbd> ניווט ·
      <kbd>Shift</kbd>+גרירה = ציור תיבה חדשה
    </div>
  </header>

  <div id="list"></div>

  <div id="edit"></div>

  <footer>
    <button id="save" class="pri">ייצוא schema.json</button>
    <button id="stats">סטטוס</button>
  </footer>
</div>

<script>
const S = { draft: null, labels: {}, page: 0, sel: null, imgs: {}, scale: 1 };
const $ = s => document.querySelector(s);

const TYPES = ["text", "comb", "radio_option", "checkbox", "drop"];
const VALIDATORS = ["none","text","israeli_id","tax_file_number","date_ddmmyy",
                    "date_ddmmyyyy","mobile","phone","postal_code","tax_year","email"];

$("#fJson").onchange = async e => {
  const j = JSON.parse(await e.target.files[0].text());
  if (j.fields && j.status) { S.draft = j; j.fields.forEach(prep); }
  else { S.labels = j; applyLabels(); }        // labels.bedrock.json
  buildPages(); render();
};
$("#fImg").onchange = e => {
  for (const f of e.target.files) {
    const m = f.name.match(/page_(\d+)/);
    if (m) S.imgs[+m[1]] = URL.createObjectURL(f);
  }
  render();
};

function prep(f) {
  f._id = f.semantic_id || "";
  f._type = f.kind === "checkbox" ? "radio_option" : (f.kind === "comb" ? "comb" : "text");
  f._validator = (f.guessed_type || "").replace(/!.*/, "") || "none";
  if (!VALIDATORS.includes(f._validator)) f._validator = "none";
  f._group = "";
  f._state = "todo";                            // todo | ok | drop
  f._flag = /MISMATCH/.test(f.guessed_type || "") ? f.guessed_type : "";
}

function applyLabels() {
  if (!S.draft) return alert("טען קודם את schema.draft.json");
  for (const f of S.draft.fields) {
    const l = S.labels[f.id]; if (!l) continue;
    f._id = l.semantic_id || f._id;
    f.label_he = l.label_he || f.label_he;
    f.section = l.section_he || "";
    f._group = l.group_key || "";
    if (l.validator && VALIDATORS.includes(l.validator)) f._validator = l.validator;
    if (l.note) f._flag = l.note;
    if ((l.confidence ?? 0) >= 0.9 && !l.note) f._state = "ok";
  }
}

function buildPages() {
  $("#page").innerHTML = "";
  for (let p = 0; p < S.draft.pages; p++)
    $("#page").add(new Option("עמוד " + (p + 1), p));
  $("#page").onchange = () => { S.page = +$("#page").value; S.sel = null; render(); };
}

const visible = () => !S.draft ? [] : S.draft.fields.filter(f => {
  if (f.page !== S.page) return false;
  const v = $("#filter").value;
  return v === "all" || (v === "todo" && f._state === "todo")
      || (v === "flag" && f._flag) || f.kind === v;
});
$("#filter").onchange = render;

function render() {
  if (!S.draft) return;
  const img = $("#pg"), ov = $("#ov");
  img.src = S.imgs[S.page] || "";
  img.onload = () => {
    // draft bboxes are in PDF points; the PNG was rendered at some dpi — derive the scale
    S.scale = img.naturalWidth / S.draft.page_size[0];
    ov.setAttribute("width", img.width); ov.setAttribute("height", img.height);
    ov.setAttribute("viewBox", `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    drawOverlay();
  };
  if (img.complete && img.naturalWidth) img.onload();
  drawList();
  drawEdit();
}

function drawOverlay() {
  const ov = $("#ov"); ov.innerHTML = "";
  for (const f of visible()) {
    const [x0, y0, x1, y1] = f.bbox, k = S.scale;
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("x", x0 * k); r.setAttribute("y", y0 * k);
    r.setAttribute("width", (x1 - x0) * k); r.setAttribute("height", (y1 - y0) * k);
    r.setAttribute("class", `cand ${f.kind} ${f._state === "ok" ? "confirmed" : ""} `
                          + `${f._state === "drop" ? "dropped" : ""} ${f === S.sel ? "sel" : ""}`);
    r.onclick = () => { S.sel = f; render(); };
    ov.appendChild(r);
  }
}

function drawList() {
  $("#list").innerHTML = "";
  for (const f of visible()) {
    const d = document.createElement("div");
    d.className = "row" + (f === S.sel ? " sel" : "");
    d.innerHTML = `<span class="dot ${f._state === "ok" ? "ok" : f._state === "drop" ? "drop" : "todo"}"></span>
                   <span class="id">${f._id || f.id}</span>
                   <span class="lb">${f.label_he || "<i>ללא תווית</i>"}</span>`;
    d.onclick = () => { S.sel = f; render(); };
    $("#list").appendChild(d);
  }
}

function drawEdit() {
  const f = S.sel;
  if (!f) { $("#edit").innerHTML = '<p style="color:var(--dim)">בחר מועמד מהרשימה או מהתמונה.</p>'; return; }
  $("#edit").innerHTML = `
    ${f._flag ? `<div class="hint">⚠ ${f._flag}</div>` : ""}
    <label>semantic id (snake_case)</label><input id="e_id" value="${f._id}">
    <label>תווית בעברית</label><input id="e_lb" value="${(f.label_he || "").replace(/"/g, "&quot;")}">
    <div class="grid2">
      <div><label>סוג</label><select id="e_ty">${TYPES.map(t =>
        `<option ${t === f._type ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div><label>ולידציה</label><select id="e_va">${VALIDATORS.map(v =>
        `<option ${v === f._validator ? "selected" : ""}>${v}</option>`).join("")}</select></div>
    </div>
    <label>קבוצת radio (מפתח משותף)</label><input id="e_gr" value="${f._group}">
    ${f.kind === "comb" ? `<div class="grid2">
      <div><label>מספר תאים</label><input id="e_cells" type="number" value="${f.cells}"></div>
      <div><label>pitch</label><input id="e_pitch" type="number" step="0.01" value="${f.pitch}"></div></div>
      <div class="grid2">
      <div><label>y עליון</label><input id="e_y0" type="number" step="0.1" value="${f.bbox[1]}"></div>
      <div><label>y תחתון</label><input id="e_y1" type="number" step="0.1" value="${f.bbox[3]}"></div></div>
      <div class="grid2">
      <div><label>x שמאלי</label><input id="e_x0" type="number" step="0.1" value="${f.bbox[0]}"></div>
      <div><label></label><button id="e_rebuild">בנה תאים מחדש</button></div></div>` : ""}
    <div class="grid2" style="margin-top:12px">
      <button class="pri" id="e_ok">אשר (A)</button>
      <button class="danger" id="e_drop">מחק (D)</button>
    </div>`;

  const sync = () => {
    f._id = $("#e_id").value.trim(); f.label_he = $("#e_lb").value;
    f._type = $("#e_ty").value; f._validator = $("#e_va").value;
    f._group = $("#e_gr").value.trim();
  };
  $("#edit").oninput = sync;

  if (f.kind === "comb") $("#e_rebuild").onclick = () => {
    const n = +$("#e_cells").value, p = +$("#e_pitch").value;
    const x0 = +$("#e_x0").value, y0 = +$("#e_y0").value, y1 = +$("#e_y1").value;
    f.cells = n; f.pitch = p;
    f.cell_boxes = Array.from({ length: n }, (_, i) =>
      [+(x0 + i * p).toFixed(2), y0, +(x0 + (i + 1) * p).toFixed(2), y1]);
    f.bbox = [x0, y0, +(x0 + n * p).toFixed(2), y1];
    f._flag = ""; render();
  };
  $("#e_ok").onclick = () => { sync(); if (!f._id) return alert("חסר semantic id");
                               f._state = "ok"; next(); };
  $("#e_drop").onclick = () => { f._state = "drop"; next(); };
}

function next() {
  const v = visible(), i = v.indexOf(S.sel);
  S.sel = v[i + 1] || null; render();
}

addEventListener("keydown", e => {
  if (/INPUT|SELECT/.test(document.activeElement.tagName) || !S.sel) return;
  if (e.key === "a" || e.key === "A") $("#e_ok").click();
  if (e.key === "d" || e.key === "D") $("#e_drop").click();
  if (e.key === "ArrowDown") { next(); e.preventDefault(); }
  if (e.key === "ArrowUp") {
    const v = visible(), i = v.indexOf(S.sel); S.sel = v[i - 1] || S.sel; render(); e.preventDefault();
  }
});

$("#stats").onclick = () => {
  const f = S.draft.fields;
  const c = s => f.filter(x => x._state === s).length;
  alert(`סה"כ ${f.length}\nאושרו ${c("ok")}\nנמחקו ${c("drop")}\nממתינים ${c("todo")}`);
};

$("#save").onclick = () => {
  const ok = S.draft.fields.filter(f => f._state === "ok");
  if (!ok.length) return alert("לא אושר אף שדה");
  const dup = ok.map(f => f._id).filter((v, i, a) => a.indexOf(v) !== i);
  if (dup.length) return alert("semantic id כפול: " + [...new Set(dup)].join(", "));

  const groups = {}, fields = [];
  for (const f of ok) {
    const base = { id: f._id, label_he: f.label_he, section: f.section || "",
                   page: f.page, type: f._type };
    if (f._type === "radio_option" || f._type === "checkbox") {
      const g = f._group || f._id;
      (groups[g] ??= { id: g, kind: f._type === "radio_option" ? "radio" : "multiselect",
                       label_he: g, page: f.page, members: [], bbox: null }).members.push(f._id);
      fields.push({ ...base, group: g, mark_bbox: f.bbox, mark_style: "X", bbox: f.bbox });
    } else if (f._type === "comb") {
      fields.push({ ...base, validator: f._validator, cells: f.cells,
                    fill_direction: "ltr", cell_boxes: f.cell_boxes, bbox: f.bbox });
    } else {
      fields.push({ ...base, validator: f._validator,
                    align: S.draft.direction === "rtl" ? "right" : "left", bbox: f.bbox });
    }
  }
  for (const g of Object.values(groups)) {
    const ms = fields.filter(x => g.members.includes(x.id));
    g.bbox = [Math.min(...ms.map(m => m.bbox[0])) - 4, Math.min(...ms.map(m => m.bbox[1])) - 4,
              Math.max(...ms.map(m => m.bbox[2])) + 4, Math.max(...ms.map(m => m.bbox[3])) + 4];
    ms.forEach(m => m.group_bbox = g.bbox);
  }

  const out = { form_id: S.draft.form_id, schema_version: "1.0.0", status: "CONFIRMED",
                source_pdf: S.draft.source_pdf, pdf_sha256: S.draft.pdf_sha256,
                direction: S.draft.direction, pages: S.draft.pages,
                page_size: S.draft.page_size, coordinate_system: S.draft.coordinate_system,
                groups: Object.values(groups), fields };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  a.download = "schema.json"; a.click();
};
</script>
