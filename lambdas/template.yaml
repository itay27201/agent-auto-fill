AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Document-filling agent — REST API, WebSocket agent, and ingest pipeline.

Parameters:
  Stage:
    Type: String
    Default: dev
  BedrockModelId:
    Type: String
    Default: eu.anthropic.claude-sonnet-4-6
    Description: >-
      Inference profile id, not the base model id. Sonnet 4.6 cannot be
      invoked on demand as anthropic.claude-sonnet-4-6; it needs a geography
      prefix (eu./us./apac./global.). Pick by data-residency requirement.
  AllowedOrigin:
    Type: String
    Default: "*"

Globals:
  Function:
    Runtime: python3.12
    # x86_64, not arm64: the CodeBuild pipeline host is x86_64 with no QEMU
    # cross-arch emulation set up, and `sam build --use-container` can't run
    # an arm64 build container there (fails with "exec format error"). arm64
    # would save ~20% on Lambda cost, but only works with either a matching
    # build host or emulation set up first.
    Architectures: [x86_64]
    MemorySize: 1024
    Timeout: 30
    Tracing: Active
    Layers: [!Ref DepsLayer]
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        # DOCS_BUCKET/ARTIFACTS_BUCKET are deliberately NOT global: SAM's
        # Globals.Function.Environment.Variables merges into every function
        # (Globals values can't be unset per-function, only overridden), and
        # OnUploadFn is triggered BY DocsBucket -- if it also depended ON
        # DocsBucket via an inherited env var, the two resources would
        # depend on each other. Each function below declares only the
        # bucket(s) it actually uses.
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref AWS::Region
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        POWERTOOLS_LOG_LEVEL: INFO

Resources:

  # ----------------------------------------------------------------- storage
  Key:
    Type: AWS::KMS::Key
    Properties:
      Description: Form agent — documents contain dense PII
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref Key
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: purge-uploads
            Status: Enabled
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt OnUploadFn.Arn
            Filter:
              S3Key:
                Rules: [{ Name: prefix, Value: uploads/ }]

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref Key
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Session artifacts expire. Schemas and everything under catalog/ do
          # not: the registry is what makes repeat forms free, and a catalog
          # entry has to outlive every session that used it. Both rules are
          # prefix-scoped for exactly that reason — an unscoped rule here
          # would quietly delete the catalog after a week.
          - Id: purge-derived
            Status: Enabled
            Prefix: derived/
            ExpirationInDays: 7
          - Id: purge-outputs
            Status: Enabled
            Prefix: outputs/
            ExpirationInDays: 7
      # Instruction booklets are uploaded browser -> S3 with a presigned PUT,
      # the same as form uploads to DocsBucket, so this bucket needs the same
      # CORS allowance. It stays private otherwise: reads are presigned GETs.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref AllowedOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref Key
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layer/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
    Metadata:
      BuildMethod: python3.12

  # --------------------------------------------------------------------- api
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      TracingEnabled: true
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowHeaders: "'content-type,authorization'"
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
      # Attach a Cognito authorizer before this handles real documents.
      # Auth:
      #   DefaultAuthorizer: CognitoAuth
      #   Authorizers:
      #     CognitoAuth:
      #       UserPoolArn: !GetAtt UserPool.Arn

  CreateSessionFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_create_session.lambda_handler
      Environment: { Variables: { UPLOAD_URL_TTL: "900", DOCS_BUCKET: !Ref DocsBucket } }
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref Table }
        - S3WritePolicy: { BucketName: !Ref DocsBucket }
        # DynamoDB SSE with a customer-managed KMS key needs kms:Decrypt on
        # every table operation, including writes -- PutItem has to decrypt
        # the table's existing data key, not just encrypt with it. Encrypt
        # alone (confirmed live: AccessDeniedException on kms:Decrypt).
        - KMSEncryptPolicy: { KeyId: !Ref Key }
        # KMSEncryptPolicy grants kms:Encrypt only. S3 PutObject/CopyObject
        # against an SSE-KMS bucket calls kms:GenerateDataKey to create a new
        # per-object data key -- a different action, confirmed live as a 403
        # on a presigned PUT signed with only kms:Encrypt.
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey*
              Resource: !GetAtt Key.Arn
        - KMSDecryptPolicy: { KeyId: !Ref Key }
      Events:
        Post:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /sessions, Method: POST }

  GetSessionFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_get_session.lambda_handler
      Environment: { Variables: { ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref DocsBucket }
        - S3ReadPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
      Events:
        Get:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/sessions/{session_id}", Method: GET }

  SetFieldsFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_set_fields.lambda_handler
      Environment: { Variables: { ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
      Events:
        Patch:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/sessions/{session_id}/fields", Method: PATCH }

  ValidateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_validate.lambda_handler
      Environment: { Variables: { ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
      Events:
        Post:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/sessions/{session_id}/validate", Method: POST }

  RenderFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_render.lambda_handler
      MemorySize: 2048
      Timeout: 120
      Environment: { Variables: { DOCS_BUCKET: !Ref DocsBucket, ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref DocsBucket }
        - S3CrudPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
        - KMSEncryptPolicy: { KeyId: !Ref Key }
        # KMSEncryptPolicy grants kms:Encrypt only. S3 PutObject/CopyObject
        # against an SSE-KMS bucket calls kms:GenerateDataKey to create a new
        # per-object data key -- a different action, confirmed live as a 403
        # on a presigned PUT signed with only kms:Encrypt.
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey*
              Resource: !GetAtt Key.Arn
      Events:
        Post:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/sessions/{session_id}/render", Method: POST }

  # ---------------------------------------------------------------- catalog
  # The closed list of forms an agency issues. Defining an entry reuses the
  # ingest pipeline; filling one from the catalog skips it entirely.

  CatalogListFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_catalog_list.lambda_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        # DynamoDB SSE with a customer-managed key needs kms:Decrypt on
        # every table operation, reads included.
        - KMSDecryptPolicy: { KeyId: !Ref Key }
      Events:
        Get:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /catalog, Method: GET }

  CatalogGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_catalog_get.lambda_handler
      Environment: { Variables: { ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
      Events:
        Get:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/catalog/{catalog_id}", Method: GET }

  CatalogCreateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_catalog_create.lambda_handler
      Timeout: 60          # copies the master, the schema and every page raster
      Environment: { Variables: { DOCS_BUCKET: !Ref DocsBucket, ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref DocsBucket }
        - S3CrudPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
        - KMSEncryptPolicy: { KeyId: !Ref Key }
        # KMSEncryptPolicy grants kms:Encrypt only. S3 PutObject/CopyObject
        # against an SSE-KMS bucket calls kms:GenerateDataKey to create a new
        # per-object data key -- a different action, confirmed live as a 403
        # on a presigned PUT signed with only kms:Encrypt.
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey*
              Resource: !GetAtt Key.Arn
      Events:
        Post:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /catalog, Method: POST }

  CatalogUpdateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_catalog_update.lambda_handler
      Environment: { Variables: { ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
        - KMSEncryptPolicy: { KeyId: !Ref Key }
        # KMSEncryptPolicy grants kms:Encrypt only. S3 PutObject/CopyObject
        # against an SSE-KMS bucket calls kms:GenerateDataKey to create a new
        # per-object data key -- a different action, confirmed live as a 403
        # on a presigned PUT signed with only kms:Encrypt.
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey*
              Resource: !GetAtt Key.Arn
      Events:
        Patch:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/catalog/{catalog_id}", Method: PATCH }

  CatalogSourceFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_catalog_source.lambda_handler
      Environment: { Variables: { UPLOAD_URL_TTL: "900", ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Table }
        - S3WritePolicy: { BucketName: !Ref ArtifactsBucket }
        # DynamoDB read needs kms:Decrypt too, not just S3's kms:Encrypt.
        - KMSEncryptPolicy: { KeyId: !Ref Key }
        # KMSEncryptPolicy grants kms:Encrypt only. S3 PutObject/CopyObject
        # against an SSE-KMS bucket calls kms:GenerateDataKey to create a new
        # per-object data key -- a different action, confirmed live as a 403
        # on a presigned PUT signed with only kms:Encrypt.
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey*
              Resource: !GetAtt Key.Arn
        - KMSDecryptPolicy: { KeyId: !Ref Key }
      Events:
        Post:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/catalog/{catalog_id}/sources", Method: POST }

  CatalogSessionFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/api_catalog_session.lambda_handler
      Environment: { Variables: { ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
        - KMSEncryptPolicy: { KeyId: !Ref Key }
        # KMSEncryptPolicy grants kms:Encrypt only. S3 PutObject/CopyObject
        # against an SSE-KMS bucket calls kms:GenerateDataKey to create a new
        # per-object data key -- a different action, confirmed live as a 403
        # on a presigned PUT signed with only kms:Encrypt.
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey*
              Resource: !GetAtt Key.Arn
      Events:
        Post:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/catalog/{catalog_id}/sessions", Method: POST }

  # ----------------------------------------------------------------- ingest
  OnUploadFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/ingest_classify.on_upload
      Environment:
        Variables:
          # Literal ARN (built from the explicit Name above), not !Ref
          # IngestStateMachine -- see the comment on that resource for why.
          INGEST_STATE_MACHINE_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:agent-auto-fill-ingest-${Stage}"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        # DynamoDB SSE with a customer-managed key needs kms:Decrypt on every
        # table operation (get_session/update_session here), not just writes
        # of new data -- same reason as CreateSessionFn.
        - KMSDecryptPolicy: { KeyId: !Ref Key }
        # Deliberately no DOCS_BUCKET/ARTIFACTS_BUCKET env vars and no
        # S3ReadPolicy on DocsBucket: on_upload() never reads the object,
        # only the event record, and this function is triggered BY
        # DocsBucket (see its NotificationConfiguration below) -- if it also
        # depended ON DocsBucket, the two resources would form a circular
        # dependency. Same reason OnUploadPermission below is scoped by
        # SourceAccount rather than a SourceArn naming this bucket, and the
        # policy below names the state machine by literal ARN rather than
        # !Ref/!GetAtt.
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:agent-auto-fill-ingest-${Stage}"

  OnUploadPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OnUploadFn
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  ClassifyFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/ingest_classify.lambda_handler
      MemorySize: 1536
      Timeout: 120
      Environment: { Variables: { DOCS_BUCKET: !Ref DocsBucket, ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref DocsBucket }
        - S3CrudPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
        - KMSEncryptPolicy: { KeyId: !Ref Key }
        # KMSEncryptPolicy grants kms:Encrypt only. S3 PutObject/CopyObject
        # against an SSE-KMS bucket calls kms:GenerateDataKey to create a new
        # per-object data key -- a different action, confirmed live as a 403
        # on a presigned PUT signed with only kms:Encrypt.
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey*
              Resource: !GetAtt Key.Arn

  ExtractFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/ingest_extract.lambda_handler
      MemorySize: 3008          # rasterizing 20 pages is memory-bound
      Timeout: 600
      Environment: { Variables: { DOCS_BUCKET: !Ref DocsBucket, ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref DocsBucket }
        - S3CrudPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
        - KMSEncryptPolicy: { KeyId: !Ref Key }
        # KMSEncryptPolicy grants kms:Encrypt only. S3 PutObject/CopyObject
        # against an SSE-KMS bucket calls kms:GenerateDataKey to create a new
        # per-object data key -- a different action, confirmed live as a 403
        # on a presigned PUT signed with only kms:Encrypt.
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey*
              Resource: !GetAtt Key.Arn

  EnrichFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/ingest_enrich.lambda_handler
      MemorySize: 2048
      Timeout: 900
      Environment: { Variables: { ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              # Both ARNs are needed: the inference profile you call, and the
              # foundation models it can route to across the geography.
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6"

  FinalizeFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/ingest_finalize.lambda_handler
      Environment: { Variables: { ARTIFACTS_BUCKET: !Ref ArtifactsBucket } }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref ArtifactsBucket }
        # Same reason as CreateSessionFn: DynamoDB writes need Decrypt, not
        # just Encrypt -- and copy_schema's S3 CopySource read needs it too.
        - KMSEncryptPolicy: { KeyId: !Ref Key }
        # KMSEncryptPolicy grants kms:Encrypt only. S3 PutObject/CopyObject
        # against an SSE-KMS bucket calls kms:GenerateDataKey to create a new
        # per-object data key -- a different action, confirmed live as a 403
        # on a presigned PUT signed with only kms:Encrypt.
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey*
              Resource: !GetAtt Key.Arn
        - KMSDecryptPolicy: { KeyId: !Ref Key }

  IngestFailedFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/ingest_finalize.on_failure
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        # Same DynamoDB-writes-need-Decrypt reason as CreateSessionFn.
        - KMSDecryptPolicy: { KeyId: !Ref Key }

  IngestStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      # Explicit name so OnUploadFn can reference this state machine's ARN as
      # a literal string (below) instead of !Ref/!GetAtt. OnUploadFn is
      # triggered BY DocsBucket; this machine's role in turn depends on
      # ClassifyFn/ExtractFn, which depend on DocsBucket -- so a real !Ref
      # from OnUploadFn to this resource would close a circular dependency
      # through that chain. The physical resource is identical either way,
      # this only changes what CloudFormation's dependency graph sees.
      Name: !Sub "agent-auto-fill-ingest-${Stage}"
      DefinitionUri: statemachine/ingest.asl.json
      DefinitionSubstitutions:
        ClassifyArn: !GetAtt ClassifyFn.Arn
        ExtractArn: !GetAtt ExtractFn.Arn
        EnrichArn: !GetAtt EnrichFn.Arn
        FinalizeArn: !GetAtt FinalizeFn.Arn
        OnFailureArn: !GetAtt IngestFailedFn.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref ClassifyFn }
        - LambdaInvokePolicy: { FunctionName: !Ref ExtractFn }
        - LambdaInvokePolicy: { FunctionName: !Ref EnrichFn }
        - LambdaInvokePolicy: { FunctionName: !Ref FinalizeFn }
        - LambdaInvokePolicy: { FunctionName: !Ref IngestFailedFn }

  # -------------------------------------------------------------- websocket
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "form-agent-ws-${Stage}"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  AgentChatFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/agent_chat.lambda_handler
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          WS_ENDPOINT: !Sub "https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
          ARTIFACTS_BUCKET: !Ref ArtifactsBucket
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6"
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*"

  AgentChatPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AgentChatFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*"

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AgentChatFn.Arn}/invocations"

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $connect
      Target: !Sub "integrations/${WsIntegration}"

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${WsIntegration}"

  WsMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: message
      Target: !Sub "integrations/${WsIntegration}"

  # The second agent. Same WebSocket API — RouteSelectionExpression is
  # $request.body.action, so `author` reaches a different Lambda with a
  # different prompt and a disjoint tool set. It can write a catalog guide and
  # cannot touch anyone's form values; AgentChatFn is the reverse.
  AuthorChatFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions/author_chat.lambda_handler
      MemorySize: 1024
      # 900s, the Lambda maximum. write_field_notes fans a long form out over
      # several parallel vision calls inside ONE tool call, so a single turn
      # here legitimately runs for minutes. Nothing is waiting on the response:
      # the WebSocket handler pushes frames with post_to_connection and returns
      # 200 immediately, so this bounds the work, not a client's patience.
      Timeout: 900
      Environment:
        Variables:
          WS_ENDPOINT: !Sub "https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
          ARTIFACTS_BUCKET: !Ref ArtifactsBucket
          # Higher than the filling agent's 8 because writing a guide is a
          # sitting, not an exchange. Not much higher: batching the field notes
          # is what removed the need for a big number, and a large cap mostly
          # buys the freedom to thrash for a quarter of an hour before failing.
          MAX_AGENT_TURNS: "16"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref ArtifactsBucket }
        - KMSDecryptPolicy: { KeyId: !Ref Key }
        - KMSEncryptPolicy: { KeyId: !Ref Key }
        # KMSEncryptPolicy grants kms:Encrypt only. S3 PutObject/CopyObject
        # against an SSE-KMS bucket calls kms:GenerateDataKey to create a new
        # per-object data key -- a different action, confirmed live as a 403
        # on a presigned PUT signed with only kms:Encrypt.
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey*
              Resource: !GetAtt Key.Arn
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6"
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*"

  AuthorChatPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorChatFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*"

  WsAuthorIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorChatFn.Arn}/invocations"

  WsAuthorRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: author
      Target: !Sub "integrations/${WsAuthorIntegration}"

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WsApi
      StageName: !Ref Stage
      AutoDeploy: true

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  WebSocketUrl:
    Value: !Sub "wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  DocsBucketName:
    Value: !Ref DocsBucket
  TableName:
    Value: !Ref Table
